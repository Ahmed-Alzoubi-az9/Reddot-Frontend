    <!----------------Sgin In------------------->
    <section class="pt-5 bg-mix-4 pb-5 position-relative" id="sign-in-section-log">
      <div class="blurred-circles-6"></div> <!-- Blurred background -->

        <div class="container-fluid pt-5">
            <div class="row position-relative pt-5">
                <!-- Graphic Section -->
                <div class="col-lg-6 col-md-6 d-none d-lg-block pt-5 position-relative d-flex justify-content-center align-items-center">
                  <!-- Circle Image (Behind) -->
                  <img src="../Resources/img/circle-sign.png" class="img-fluid position-absolute top-50 start-50 translate-middle" alt="Circle Image" style="z-index: 1;">
                
                  <!-- Sign-in Image (In Front) -->
                  <img src="../Resources/img/sign-in-img.png" class="img-fluid position-absolute top-50 start-50 translate-middle" alt="Sign In Image" style="z-index: 2; ">
                </div>
                
                
                
                <!-- Sign-in form -->
                <div class="col-lg-6 justify-content-center align-items-center pt-4 pe-5 " id="Sign-in-form">
                    <div class="card-color p-4" style="border-radius: 4%;">
                        <h3 class="text-center text-white py-5">Sign Up</h3>
                
                        <form>
                            <div class="form-group mb-3 px-4">
                                <div class="input-group bg-none">
                                    <input type="email" class="form-control p-3 bg-transparent color-border-gray no-outline color-sign ps-5" id="email" placeholder="Email Address" style="border-radius: 15px;  border-width: 1px;">
                                    <img src="../Resources/img/Message-2.png" class="ps-2 position-absolute top-50 start-0 translate-middle-y" alt="Message Icon">
                                </div>
                            </div>
                
                            
                
                            <div class="form-group mb-3 px-4">
                                <div class="input-group">
                                    <input type="password" class="form-control p-3 bg-transparent color-border-gray no-outline color-sign ps-5" id="password" placeholder="Password" style="border-radius: 15px;">
                                    <img src="../Resources/img/Unlock.png" class="ps-2 position-absolute top-50 start-0 translate-middle-y" alt="Lock Icon">
                                    <i class="fa fa-eye-slash position-absolute top-50 end-0 translate-middle-y pe-3" id="togglePassword" style="cursor: pointer;"></i>
                                </div>
                            </div>
                
                            <div class="form-group mb-3 px-4">
                                <div class="input-group">
                                    <input type="password" class="form-control p-3 bg-transparent color-border-gray no-outline color-sign ps-5" id="confirmPassword" placeholder="Confirm Password" style="border-radius: 15px;">
                                    <img src="../Resources/img/Unlock.png" class="ps-2 position-absolute top-50 start-0 translate-middle-y" alt="Lock Icon">
                                    <i class="fa fa-eye-slash position-absolute top-50 end-0 translate-middle-y pe-3" id="togglePassword" style="cursor: pointer;"></i>

                                  </div>
                            </div>
                

                            <div class="form-group mb-3 px-4">
                              <div class="input-group">
                                  <!-- Fixed country code prefix -->
                                  <span class="input-group-text p-3 bg-transparent color-border-gray no-outline color-sign ps-5 color-sign" style="border-radius: 15px 0 0 15px;">+962</span>
                                  <!-- Phone number input field -->
                                  <input type="tel" class="form-control p-3 bg-transparent color-border-gray no-outline color-sign" placeholder="Phone Number" style="border-radius: 0 15px 15px 0;">
                                  <img src="../Resources/img/Phone-2.png" class="ps-2 position-absolute top-50 start-0 translate-middle-y" alt="Phone Icon">
                              </div>
                          </div>
                          
                            <div class="form-group d-flex justify-content-between align-items-center">
                                <div class="form-check ps-5 pt-2">
                                    <input type="checkbox" class="form-check-input bg-transparent color-border no-outline" id="rememberMe">
                                    <label class="form-check-label color-sign" for="rememberMe">Remember Me</label>
                                </div>
                                <a href="contact-us.html" class="pink-text text-decoration-none pt-2 hover-white pe-5">Forget Password?</a>
                            </div>
                
                            <div class="form-group pt-3 d-flex justify-content-center pb-4 sign-in-btn">
                                <button type="submit" class="btn bg-pink text-white hover-sign-btn py-3 mt-5 rounded-pill w-50">Sign In</button>
                            </div>
                
                            <div class="text-center">
                                <span class="color-sign">Already Have An Account? </span><a href="sign-in.html" class="pink-text text-decoration-none hover-white">Sign In</a><br>
                                <span class="color-sign"> Or Continue With</span>
                            </div>
                
                            <div class="form-group d-flex justify-content-center pt-4 pb-4">
                                <a href="#" class="btn me-1 sign-btn" style="border-radius: 50%; padding: 10px; background-color: #2c2c2c;">
                                    <img src="../Resources/img/Google - normal.png" alt="">
                                </a>
                                <a href="#" class="btn ms-2 sign-btn" style="border-radius: 50%; padding: 10px; background-color: #2c2c2c;">
                                    <img src="../Resources/img/Facebook - normal.png" alt="">
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </section>
